<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลสินค้า (Product Management System)</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }

        .product-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background-color: #ffffff;
        }

        .input-group-text {
            background-color: #f8f9fa;
            color: #198754;
        }

        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="#">
                <i class="bi bi-box-seam-fill me-2 fs-3 text-warning"></i>
                ระบบจัดการสินค้า (Product Management App)
            </a>
            <span class="badge bg-light text-dark px-3 py-2 rounded-pill fw-normal">
                <i class="bi bi-hdd-network me-1 text-primary"></i> REST API Integrated
            </span>
        </div>
    </nav>

    <div class="container pb-5">
        
        <!-- SECTION: SEARCH & PRODUCT LIST TABLE -->
        <div class="card product-card mb-4">
            <div class="card-body p-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
                    <h4 class="fw-bold m-0 mb-2 mb-md-0">
                        <i class="bi bi-search me-2 text-primary"></i>ค้นหาและรายการสินค้า
                    </h4>
                    <!-- ปุ่มเปิดไปยังหน้า product_insert_api.html -->
                    <a href="product_insert_api.html" class="btn btn-success">
                        <i class="bi bi-plus-lg me-1"></i> เพิ่มสินค้าใหม่
                    </a>
                </div>

                <!-- Search Input Bar -->
                <div class="row g-2 mb-3">
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="พิมพ์ชื่อสินค้า หรือ รหัสสินค้าเพื่อค้นหา...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button type="button" id="btnSearch" class="btn btn-primary w-100" onclick="fetchProducts(1)">
                            <i class="bi bi-search me-1"></i> ค้นหา
                        </button>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="table-responsive border mb-3">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">รหัส</th>
                                <th>ชื่อสินค้า</th>
                                <th>หมวดหมู่</th>
                                <th>ผู้จัดจำหน่าย</th>
                                <th>ราคา</th>
                                <th>หน่วย</th>
                                <th class="text-center" style="width: 120px;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">กำลังโหลดข้อมูลสินค้า...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Component -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                    <div id="paginationInfo" class="text-muted small"></div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
                    </nav>
                </div>

            </div>
        </div>

    </div>

    <!-- MODAL EDIT PRODUCT -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>แก้ไขข้อมูลสินค้า</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editProductForm" onsubmit="saveEditProduct(event)">
                    <div class="modal-body">
                        <input type="hidden" id="edit_ProductID">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">ชื่อสินค้า <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="edit_ProductName" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">หมวดหมู่</label>
                                <select class="form-select" id="edit_CatID">
                                    <option value="">-- เลือกหมวดหมู่ --</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">ผู้จัดจำหน่าย</label>
                                <select class="form-select" id="edit_SupplierID">
                                    <option value="">-- เลือกผู้จัดจำหน่าย --</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">ราคา <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="edit_Price" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">หน่วยนับ</label>
                                <input type="text" class="form-control" id="edit_Unit">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> บันทึกการแก้ไข</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>

    <!-- Application Script -->
    <script>
        let currentPage = 1;
        const pageLimit = 10;
        let editModalInstance = null;

        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true
        });

        document.addEventListener('DOMContentLoaded', () => {
            editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
            
            fetchProducts(1);
            loadDropdownOptions();

            // Enter Key Search Trigger
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') fetchProducts(1);
            });
        });

        // ดึงข้อมูลสินค้าแบบแบ่งหน้า
        function fetchProducts(page = 1) {
            currentPage = page;
            const keyword = document.getElementById('searchInput').value.trim();
            const tbody = document.getElementById('productTableBody');
            
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังดึงข้อมูลสินค้า...</td></tr>';

            fetch(`api/products?q=${encodeURIComponent(keyword)}&page=${page}&limit=${pageLimit}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP Status: ${res.status}`);
                    return res.json();
                })
                .then(res => {
                    const data = res.data?.items || res.data || [];
                    const pagination = res.data?.pagination || null;

                    if (data.length > 0) {
                        tbody.innerHTML = '';
                        data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td><span class="badge bg-secondary">#${item.ProductID}</span></td>
                                <td class="fw-medium">${escapeHtml(item.ProductName)}</td>
                                <td><small class="text-muted">${escapeHtml(item.CategoryName || '-')}</small></td>
                                <td><small class="text-muted">${escapeHtml(item.SupplierName || '-')}</small></td>
                                <td class="text-success fw-bold">฿${parseFloat(item.Price || 0).toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                                <td>${escapeHtml(item.Unit || '-')}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-warning me-1" title="แก้ไข" onclick="openEditModal(${item.ProductID})">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" title="ลบ" onclick="confirmDeleteProduct(${item.ProductID}, '${escapeHtml(item.ProductName)}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });

                        if (pagination) {
                            renderPaginationControls(pagination);
                        }
                    } else {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><i class="bi bi-inbox me-2"></i>ไม่พบข้อมูลสินค้า</td></tr>';
                        document.getElementById('paginationControls').innerHTML = '';
                        document.getElementById('paginationInfo').innerText = '';
                    }
                })
                .catch(err => {
                    console.error('Fetch error:', err);
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
                });
        }

        // วาดปุ่ม Pagination 1, 2, 3...
        function renderPaginationControls(pagination) {
            const controls = document.getElementById('paginationControls');
            const info = document.getElementById('paginationInfo');
            
            info.innerText = `แสดงหน้า ${pagination.current_page} จากทั้งหมด ${pagination.total_pages} หน้า (รวม ${pagination.total_items} รายการ)`;

            let html = '';

            // ปุ่ม ก่อนหน้า
            html += `<li class="page-item ${pagination.current_page <= 1 ? 'disabled' : ''}">
                        <button class="page-link" onclick="fetchProducts(${pagination.current_page - 1})">ก่อนหน้า</button>
                     </li>`;

            // เลขหน้า 1, 2, 3...
            for (let i = 1; i <= pagination.total_pages; i++) {
                html += `<li class="page-item ${i === pagination.current_page ? 'active' : ''}">
                            <button class="page-link" onclick="fetchProducts(${i})">${i}</button>
                         </li>`;
            }

            // ปุ่ม ถัดไป
            html += `<li class="page-item ${pagination.current_page >= pagination.total_pages ? 'disabled' : ''}">
                        <button class="page-link" onclick="fetchProducts(${pagination.current_page + 1})">ถัดไป</button>
                     </li>`;

            controls.innerHTML = html;
        }

        // โหลด Dropdown Categories/Suppliers สำหรับ Modal
        async function loadDropdownOptions() {
            try {
                const [catRes, supRes] = await Promise.all([
                    fetch('process_product.php?action=get_categories').then(r => r.json()),
                    fetch('process_product.php?action=get_suppliers').then(r => r.json())
                ]);

                if (catRes.success) {
                    const catSelect = document.getElementById('edit_CatID');
                    catRes.data.forEach(c => {
                        catSelect.innerHTML += `<option value="${c.i_CategoryID}">${escapeHtml(c.c_CategoryName)}</option>`;
                    });
                }

                if (supRes.success) {
                    const supSelect = document.getElementById('edit_SupplierID');
                    supRes.data.forEach(s => {
                        supSelect.innerHTML += `<option value="${s.i_SupplierID}">${escapeHtml(s.c_SupplierName)}</option>`;
                    });
                }
            } catch (err) {
                console.error("Error loading dropdowns:", err);
            }
        }

        // เปิด Modal และดึงข้อมูลมาแสดงเตรียมแก้ไข
        function openEditModal(id) {
            fetch(`api/products/${id}`)
                .then(res => res.json())
                .then(res => {
                    if (res.data) {
                        const p = res.data;
                        document.getElementById('edit_ProductID').value = p.ProductID;
                        document.getElementById('edit_ProductName').value = p.ProductName;
                        document.getElementById('edit_CatID').value = p.CatID || '';
                        document.getElementById('edit_SupplierID').value = p.SupplierID || '';
                        document.getElementById('edit_Price').value = p.Price;
                        document.getElementById('edit_Unit').value = p.Unit || '';

                        editModalInstance.show();
                    }
                })
                .catch(err => {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลสินค้าได้', 'error');
                });
        }

        // บันทึกการแก้ไข (PUT /api/products/{id})
        function saveEditProduct(e) {
            e.preventDefault();

            const id = document.getElementById('edit_ProductID').value;
            const payload = {
                ProductName: document.getElementById('edit_ProductName').value,
                CatID: document.getElementById('edit_CatID').value,
                SupplierID: document.getElementById('edit_SupplierID').value,
                Price: document.getElementById('edit_Price').value,
                Unit: document.getElementById('edit_Unit').value
            };

            fetch(`api/products/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.success || res.status) {
                    editModalInstance.hide();
                    Toast.fire({ icon: 'success', title: 'อัปเดตข้อมูลสินค้าเรียบร้อยแล้ว' });
                    fetchProducts(currentPage);
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', res.message || 'ไม่สามารถแก้ไขได้', 'error');
                }
            })
            .catch(err => {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            });
        }

        // ลบสินค้า
        function confirmDeleteProduct(id, name) {
            Swal.fire({
                title: 'ยืนยันการลบสินค้า?',
                html: `คุณต้องการลบรายการ <strong>"${name}"</strong> (รหัส: #${id}) หรือไม่?<br><small class="text-danger">การดำเนินการนี้ไม่สามารถย้อนกลับได้</small>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="bi bi-trash me-1"></i> ยืนยันลบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    executeDeleteProduct(id);
                }
            });
        }

        function executeDeleteProduct(id) {
            Swal.fire({
                title: 'กำลังลบสินค้า...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            fetch(`api/products/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(res => {
                if (res.status || res.success) {
                    Toast.fire({ icon: 'success', title: 'ลบรายการสินค้าเรียบร้อยแล้ว' });
                    fetchProducts(currentPage);
                } else {
                    Swal.fire({ icon: 'error', title: 'ลบสินค้าล้มเหลว', text: res.message || 'ไม่สามารถลบสินค้านี้ได้' });
                }
            })
            .catch(err => {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อลบข้อมูลได้' });
            });
        }

        // Prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
